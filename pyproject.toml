[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "expra-connect"
dynamic = ["version"]
description = "Headless identity, discovery, pairing, transport, sharing, and cluster primitives"
requires-python = ">=3.10"
dependencies = ["cryptography>=41", "typing-extensions>=4.6", "zeroconf>=0.132"]

[project.optional-dependencies]
dev = ["mypy>=1.10", "pyright>=1.1.350", "ruff>=0.6"]

[project.scripts]
expra-peer = "expra_connect.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.dynamic]
version = {attr = "expra_connect._version.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "standard"

[tool.mypy]
strict = true
python_version = "3.10"
