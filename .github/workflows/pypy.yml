name: PyPy compatibility

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: pypy3.11
      - name: Install project and test harness
        run: python -m pip install -e . -e tools/peer_harness
      - name: Run test suite
        run: python -m unittest discover -s tests -t .
