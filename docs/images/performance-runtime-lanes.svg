<text x="650" y="186" font-family="Arial, sans-serif" font-size="12px" fill="#17252a">2.234 µs</text>
<text x="910" y="186" font-family="Arial, sans-serif" font-size="12px" fill="#17252a">0.301 µs</text>
<line x1="24" y1="196" x2="1150" y2="196" stroke="#d7e0e2"/>
